# Paris Buyer Copilot — Fly.io app config
# Initial deploy: `flyctl launch --no-deploy --copy-config` then `flyctl deploy`.

# `app` is filled in by `flyctl launch`; replace if your app name differs.
app = "paris-buyer-copilot"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DUCKDB_PATH = "/app/data/paris.duckdb"
  USER_AGENT = "ParisBuyerCopilot/0.1 (+https://paris-buyer-copilot.fly.dev)"
  OPENAI_MODEL = "gpt-4.1-mini"
  # CORS_ORIGINS is set as a Fly secret so we can update without re-deploys.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"  # plenty of headroom for DuckDB + spatial extension
